name: Sync eBay listings

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch listings from eBay
        run: node scripts/sync.mjs
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Save changes
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add docs/listings.json
          git diff --cached --quiet || git commit -m "Update eBay listings"
          git push
